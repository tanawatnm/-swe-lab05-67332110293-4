[tool.ruff]
line-length = 100
extend-exclude = ["lab04-ai-coding-ux", "pricing_legacy.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["lab04-ai-coding-ux"]
pythonpath = ["."]

[tool.coverage.run]
omit = [
    "inventory_service.py",
    "lab04-ai-coding-ux/*",
    "tests/*",
]
